# HTTPS for the home network (docs/docker.md): Caddy in front of kontor, with a certificate from its own
# certificate authority. Add it to the base file:
#
#   KONTOR_HOST=raspberrypi.local docker compose -f compose.yaml -f compose.https.yaml up -d
#
# Every device that opens kontor has to trust the root certificate of that authority once (see docs/docker.md).
services:
  kontor:
    # only Caddy is reachable from outside
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: kontor-caddy
    restart: unless-stopped
    depends_on:
      - kontor
    environment:
      KONTOR_HOST: ${KONTOR_HOST:?set KONTOR_HOST to the name or address that the browsers use, for example raspberrypi.local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
