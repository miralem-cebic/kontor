# Reusable build workflow. Called by ci.yml for pull requests and by release.yml for tags.
# Runs lint, tests and the production build, then packages dist/ into a zip with a SHA-256 checksum.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version label used in the package file name
        required: true
        type: string

permissions:
  contents: read

env:
  # Directory with the finished application (Vite build output, see DEVELOPMENT.md).
  APP_DIR: dist

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # --no-audit: the install does not wait for npm's audit service; the next step audits.
      - name: Install, test and build
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit
          else
            npm install --no-audit
          fi
          npm run typecheck
          npm run lint --if-present
          npm test --if-present
          npm run build

      # Fails on high or critical advisories in the production dependencies. An outage of
      # npm's audit service does not: after three attempts the step passes with a warning.
      # timeout-minutes is only a backstop above the worst case of the loop (just over 4 minutes).
      - name: Audit production dependencies
        if: ${{ hashFiles('package.json') != '' }}
        timeout-minutes: 6
        run: |
          report="$RUNNER_TEMP/npm-audit.json"
          for attempt in 1 2 3; do
            status=0
            timeout --kill-after=10 60 npm audit --omit=dev --audit-level=high --json > "$report" || status=$?
            if [ "$status" -eq 0 ]; then
              echo "No high or critical advisories in the production dependencies."
              exit 0
            fi
            # A report means the service answered and found advisories at or above --audit-level.
            if jq -e 'has("vulnerabilities")' "$report" > /dev/null 2>&1; then
              jq -r '.vulnerabilities[] | "\(.severity): \(.name) (\([.via[] | if type == "object" then .url else "via \(.)" end] | join(", ")))"' "$report"
              echo "::error::npm audit found high or critical advisories in the production dependencies. Run 'npm audit --omit=dev' for details and fixes."
              exit 1
            fi
            # An error with a code is npm itself failing (for example ENOLOCK); retrying does not help.
            if jq -e '.error.code' "$report" > /dev/null 2>&1; then
              cat "$report"
              echo "::error::npm audit failed: $(jq -r '.error.summary' "$report")"
              exit 1
            fi
            # Otherwise the audit service returned an error or did not answer in time (status 124).
            echo "Attempt $attempt of 3: npm's audit service returned no report (exit code $status)."
            cat "$report"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::warning::npm's audit service returned no report in 3 attempts, so the production dependencies were not audited in this run. Re-run the job to audit them."

      - name: Create package and checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::APP_DIR '$APP_DIR' does not exist. Set APP_DIR in .github/workflows/build.yml."
            exit 1
          fi
          mkdir -p release
          ARCHIVE="kontor-${VERSION}.zip"
          (cd "$APP_DIR" && zip -r -q "$GITHUB_WORKSPACE/release/$ARCHIVE" .)
          (cd release && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          ls -lh release

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: kontor-package
          path: release/
          if-no-files-found: error
          retention-days: 14
