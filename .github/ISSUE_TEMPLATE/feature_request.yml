name: Feature request
description: Suggest an idea or improvement for kontor
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please search [existing issues](https://github.com/miralem-cebic/kontor/issues) first, in case it has already been proposed.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem would this feature solve? Who has this problem?
      placeholder: "I am always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have thought about, including workarounds you currently use.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or examples from other tools are welcome.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this feature
          required: false
        - label: I agree to follow this project's Code of Conduct
          required: true
