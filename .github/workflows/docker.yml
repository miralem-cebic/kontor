# Container image of kontor (ADR 0007, docs/docker.md), reusable workflow: builds the image for this runner and
# runs scripts/docker-smoke.sh against it. Nothing is published here, so it needs read access only. Called by
# ci.yml for every pull request and by release.yml before the image is published (job "docker" there).
name: Docker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kontor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: scripts/docker-smoke.sh kontor:test
