# Publishes a GitHub release whenever a version tag such as v1.2.0 is pushed.
# Release notes combine the matching CHANGELOG.md section with GitHub's generated notes.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure the tag points to a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main. Tag ${GITHUB_REF_NAME} does not."
            exit 1
          fi

  build:
    name: build
    needs: verify-tag
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  # The container image (ADR 0007): built and smoke tested first, then published for amd64, arm64 and arm/v7
  # (Raspberry Pi) to ghcr.io as ghcr.io/<owner>/kontor:<version>, <major>.<minor> and, not for a pre-release, latest.
  # The last stage of the Dockerfile has no RUN step and the build stage runs on the build platform,
  # so no emulation (QEMU) is needed for the other platforms.
  docker-test:
    name: docker-test
    needs: build
    uses: ./.github/workflows/docker.yml

  docker:
    name: docker
    needs: docker-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: kontor-package
          path: release

      - name: Build release notes
        run: |
          VERSION="${TAG#v}"
          NOTES="$RUNNER_TEMP/release-notes.md"

          # 1. Hand-written section for this version from CHANGELOG.md
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/changelog-section.md"

          if [ -s "$RUNNER_TEMP/changelog-section.md" ]; then
            cat "$RUNNER_TEMP/changelog-section.md" > "$NOTES"
          else
            echo "::warning::No CHANGELOG.md section found for ${VERSION}. Using generated notes only."
            : > "$NOTES"
          fi

          # 2. Generated notes: pull requests since the previous release, grouped by .github/release.yml
          {
            echo
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq '.body'
          } >> "$NOTES"

          echo "--- release notes ---"
          cat "$NOTES"

      - name: Create GitHub release
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" release/* \
            --verify-tag \
            --title "kontor ${TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $PRERELEASE_FLAG
