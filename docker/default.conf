# Server of the kontor image (ADR 0007). It serves the files of the build and nothing else.
# The Content Security Policy is the one of the build (CONTENT_SECURITY_POLICY in build/fileProtocol.ts) plus
# frame-ancestors, which a <meta> tag cannot set. tests/unit/docker.test.ts keeps the two in line.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # An add_header in a location block would replace these, so there is none.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # assets/app.js has no hash in its name: the browser asks again (ETag) and gets "not modified" while it is current
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
